{% extends "base.html" %}
{% block title %}Add client — Sales Tracker{% endblock %}
{% block content %}
<div class="page-header">
  <a href="{{ url_for('sales_tracker.clients') }}" style="font-size:12px;color:var(--muted);display:inline-block;margin-bottom:6px">← Clients</a>
  <h1>Add client</h1>
  <p>Manually add a resale client — for bulk import via Excel, let's define the column format first</p>
</div>

<div class="card" style="max-width:480px">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">Client name *</label>
      <input type="text" name="client_name" value="{{ client_name or '' }}" required>
    </div>
    <div class="form-group">
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">Address</label>
      <input type="text" name="address" value="{{ address or '' }}">
    </div>
    <div class="form-group">
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">Phone</label>
      <input type="text" name="phone" value="{{ phone or '' }}">
    </div>
    <div class="form-group">
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">Salesperson (account owner)</label>
      <select name="account_owner_user_id">
        <option value="">Unassigned</option>
        {% for s in salesmen %}
        <option value="{{ s.user_id }}">{{ s.username }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Save client</button>
    <a href="{{ url_for('sales_tracker.clients') }}" class="btn btn-ghost">Cancel</a>
  </form>
</div>
{% endblock %}
